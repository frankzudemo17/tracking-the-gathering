<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.O. Friedhof</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=Manrope:wght@400;600;700;800&amp;display=swap">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#555}</style>
</head>
<body>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; background: radial-gradient(ellipse at 50% 38%, #34404D 0%, #232B34 60%, #171C22 100%); color: #F4EBD6">
  <div aria-hidden="true" style="position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg, transparent 0 14px, rgba(244, 235, 214, .03) 14px 15px)"></div>
  <div style="position: absolute; top: 34px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 28px; height: 1px; background: #C9A45C"></span><span style="font-size: 11px; font-weight: 800; letter-spacing: .3em; color: #C9A45C">AB AUF DEN FRIEDHOF</span><span style="width: 28px; height: 1px; background: #C9A45C"></span></div>
    <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 34px; font-weight: 600; line-height: 1.1">Deniz ist raus</h2>
    <span style="font-size: 13px; color: rgba(244, 235, 214, .65)">Platz 4 von 4 · Runde 7</span>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 52px; right: 52px; top: 162px; height: 352px; border: 1.5px dashed rgba(201, 164, 92, .35); border-radius: 22px"></div>
  <span style="position: absolute; top: 152px; left: 50%; transform: translateX(-50%); padding: 0 10px; background: #2B3440; font-size: 10px; font-weight: 800; letter-spacing: .24em; color: rgba(201, 164, 92, .8)">FRIEDHOF</span>

  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
    <defs>
      <linearGradient id="artD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFE6C4"></stop><stop offset=".26" stop-color="#EFE6C4"></stop><stop offset=".26" stop-color="#2D6DB5"></stop><stop offset=".5" stop-color="#2D6DB5"></stop><stop offset=".5" stop-color="#3A3337"></stop><stop offset=".74" stop-color="#3A3337"></stop><stop offset=".74" stop-color="#2E7D50"></stop><stop offset="1" stop-color="#2E7D50"></stop></linearGradient>
      <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".35"></stop><stop offset=".56" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>
      <filter id="shD" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity=".5"></feDropShadow></filter>
    </defs>
    <g filter="url(#shD)"><g transform="translate(112 206) rotate(11 100 140)" style="opacity:0.8"><rect width="200" height="280" rx="14" style="fill:#2B241C;stroke:#16191D;stroke-width:2"></rect><rect x="9" y="9" width="182" height="262" rx="9" style="fill:#5B4632"></rect><ellipse cx="100" cy="140" rx="70" ry="104" style="fill:#3E2E20;stroke:#C9A45C;stroke-width:1.5;opacity:.8"></ellipse><ellipse cx="100" cy="140" rx="46" ry="70" style="fill:none;stroke:#C9A45C;stroke-width:1;opacity:.5"></ellipse></g><g transform="translate(100 200) rotate(5 100 140)" style="opacity:1"><rect width="200" height="280" rx="14" style="fill:#2B241C;stroke:#16191D;stroke-width:2"></rect><rect x="9" y="9" width="182" height="262" rx="9" style="fill:#5B4632"></rect><ellipse cx="100" cy="140" rx="70" ry="104" style="fill:#3E2E20;stroke:#C9A45C;stroke-width:1.5;opacity:.8"></ellipse><ellipse cx="100" cy="140" rx="46" ry="70" style="fill:none;stroke:#C9A45C;stroke-width:1;opacity:.5"></ellipse></g></g>
    <g transform="translate(92 196) rotate(-6 100 140)" filter="url(#shD)">
      <rect width="206" height="288" rx="14" style="fill: #16191D"></rect>
      <rect x="8" y="8" width="190" height="272" rx="9" style="fill: #E9E2CF"></rect>
      <rect x="14" y="14" width="178" height="24" rx="5" style="fill: #F7F2E4; stroke: #8A7F66; stroke-width: 1"></rect>
      <text x="22" y="31" style="font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; fill: #16191D">Deniz</text>
      <circle cx="140" cy="26" r="5" style="fill: #EFE6C4; stroke: #16191D; stroke-width: .7"></circle><circle cx="152" cy="26" r="5" style="fill: #2D6DB5"></circle><circle cx="164" cy="26" r="5" style="fill: #3A3337"></circle><circle cx="176" cy="26" r="5" style="fill: #2E7D50"></circle>
      <rect x="18" y="42" width="170" height="104" style="fill: url(#artD); stroke: #16191D; stroke-width: 1"></rect>
      <g transform="translate(103 94)" style="opacity: .9"><path d="M-22 30 V-6 a22 22 0 0 1 44 0 V30 Z" style="fill: #E9E2CF; stroke: #16191D; stroke-width: 2"></path><path d="M-30 30 H30" style="stroke: #16191D; stroke-width: 2"></path><path d="M0 -10 V12 M-8 -2 H8" style="stroke: #16191D; stroke-width: 2.4; stroke-linecap: round"></path></g>
      <rect x="14" y="150" width="178" height="20" rx="4" style="fill: #F7F2E4; stroke: #8A7F66; stroke-width: 1"></rect>
      <text x="22" y="164" style="font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 10px; fill: #16191D">Spieler — Ausgeschieden</text>
      <g transform="translate(176 160)"><circle r="6" style="fill: #C9A45C; stroke: #16191D; stroke-width: 1"></circle></g>
      <rect x="18" y="174" width="170" height="86" style="fill: #F2EDDF; stroke: #8A7F66; stroke-width: .8"></rect>
      <text x="26" y="191" style="font-family: 'Manrope', sans-serif; font-size: 9.5px; font-weight: 700; fill: #2B2A26">Fiel in Runde 7 durch Luka.</text>
      <text x="26" y="205" style="font-family: 'Manrope', sans-serif; font-size: 9.5px; fill: #2B2A26">10 Schaden, 4 davon Commander.</text>
      <text x="26" y="219" style="font-family: 'Manrope', sans-serif; font-size: 9.5px; fill: #2B2A26">Ø Zug 5:16 · Tymna &amp; Thrasios.</text>
      <line x1="40" y1="228" x2="166" y2="228" style="stroke: #B5AB92; stroke-width: .8"></line>
      <text x="26" y="242" style="font-family: 'Outfit', sans-serif; font-style: italic; font-size: 9.5px; fill: #4A463D">„Gönn dir die Zuschauerrolle.</text>
      <text x="26" y="254" style="font-family: 'Outfit', sans-serif; font-style: italic; font-size: 9.5px; fill: #4A463D">Snacks sind in der Küche.“</text>
      <rect x="144" y="252" width="48" height="24" rx="6" style="fill: #F7F2E4; stroke: #16191D; stroke-width: 1.2"></rect>
      <text x="168" y="269" text-anchor="middle" style="font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; fill: #A3352B">−1</text>
      <rect width="206" height="288" rx="14" style="fill: url(#foil)"></rect>
      <rect width="206" height="288" rx="14" style="fill: #233040; opacity: .18"></rect>
    </g>
  </svg>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 22px 30px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap">
      <span style="padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(201, 164, 92, .35); font-size: 12px; font-weight: 700">10 Schaden von Luka</span>
      <span style="padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(201, 164, 92, .35); font-size: 12px; font-weight: 700">Ø Zug 5:16</span>
      <span style="padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(201, 164, 92, .35); font-size: 12px; font-weight: 700">4 davon Commander-Schaden</span>
    </div>
    <div style="display: flex; gap: 10px">
      <button type="button" style="flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid rgba(244, 235, 214, .25); background: transparent; color: #F4EBD6; font: inherit; font-weight: 700; cursor: pointer">Doch nicht</button>
      <button type="button" style="flex: 1.4; min-height: 52px; border-radius: 14px; border: 0; background: linear-gradient(180deg, #D8B66E, #B98F43); color: #1B1710; font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 6px 18px rgba(201, 164, 92, .25)">Auf den Friedhof</button>
    </div>
  </div>
</div>

</body>
</html>
